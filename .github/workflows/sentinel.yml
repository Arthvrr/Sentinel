name: Sentinel AI Code Review

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read
  commit-statuses: write # Ajoute cette ligne si nécessaire selon les orgs
# Change contents: read en contents: write
permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Historique complet pour les PRs !

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sentinel Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py


        