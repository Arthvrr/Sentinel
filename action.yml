name: 'Sentinel AI Code Review'
description: 'Un agent IA propulsé par Gemini 3.8 Flash qui audite vos commits.'
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  gemini_api_key:
    description: 'La clé API Google Gemini'
    required: true
  sentinel_app_id:
    description: 'L ID de la GitHub App'
    required: true
  sentinel_private_key:
    description: 'La clé privée de la GitHub App'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      # Installation des librairies requises par ton script Python
      run: pip install google-genai requests PyJWT cryptography pydantic==2.9.2 python-dotenv
      shell: bash

    - name: Run Sentinel Analysis
      env:
        # Transfert des variables d'environnement vers le script Python
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        SENTINEL_APP_ID: ${{ inputs.sentinel_app_id }}
        SENTINEL_PRIVATE_KEY: ${{ inputs.sentinel_private_key }}
      # Exécution du script main.py situé dans le dépôt Sentinel
      run: python ${{ github.action_path }}/src/main.py
      shell: bash