name: 'Sentinel AI Code Review'
description: 'Un agent IA propulsé par Gemini 3.8 Flash qui audite vos commits.'
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  gemini_api_key:
    description: 'La clé API Google Gemini (BYOK)'
    required: true
  github_token:
    description: 'Le token d authentification standard de GitHub'
    required: false
    default: ${{ github.token }}
  sentinel_app_id:
    description: 'Usage interne uniquement'
    required: false
  sentinel_private_key:
    description: 'Usage interne uniquement'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: pip install google-genai requests PyJWT cryptography pydantic==2.9.2 python-dotenv
      shell: bash

    - name: Run Sentinel Analysis
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        SENTINEL_APP_ID: ${{ inputs.sentinel_app_id }}
        SENTINEL_PRIVATE_KEY: ${{ inputs.sentinel_private_key }}
      run: python ${{ github.action_path }}/src/main.py
      shell: bash